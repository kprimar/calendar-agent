name: Calendar Agent

on:
  schedule:
    - cron: '0 1,15 * * *'  # 6pm and 8am Vancouver time (PDT / UTC-7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          python3 << 'PYEOF'
          import os, json
          for var, path in [('GMAIL_CREDENTIALS_JSON', 'credentials/credentials.json'),
                            ('GMAIL_TOKEN_JSON', 'credentials/token.json')]:
              raw = os.environ[var].lstrip('﻿')
              json.dump(json.loads(raw), open(path, 'w'))
          PYEOF

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -c "from agent.runner import run; run()"

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update processed state [skip ci]"
            git push
          fi
